name: school_sms_flutter
description: "Wonder Kids School Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1

  # Routing
  go_router: ^14.8.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # QR
  mobile_scanner: ^6.0.0
  qr_flutter: ^4.1.0

  # Utilities
  intl: ^0.20.2
  connectivity_plus: ^6.1.0
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # Charts
  fl_chart: ^0.70.2

  # i18n
  easy_localization: ^3.0.7

  # Haptics
  vibration: ^2.0.0
  share_plus: ^12.0.2
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.13
  riverpod_lint: ^2.6.1
  custom_lint: ^0.7.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/logo_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/l10n/
    - assets/images/
    - assets/sounds/
